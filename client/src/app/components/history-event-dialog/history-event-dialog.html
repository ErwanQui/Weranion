<h2 mat-dialog-title>
  @if (data) {
    {{ data.title }}  
  } @else {
    Ajout d'un nouvel évènement
  }
</h2>
<mat-dialog-content class="formEvent">
  <mat-form-field appearance="outline">
    <mat-label>Titre</mat-label>
    <input matInput [(ngModel)]="form.title" placeholder="Titre de l'évènement" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Contenu</mat-label>
    <textarea matInput [(ngModel)]="form.details" rows="5" placeholder="Détails de l'évènement"></textarea>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="close()">Annuler</button>
  <button mat-flat-button (click)="confirm()">Confirmer</button>
</mat-dialog-actions>
